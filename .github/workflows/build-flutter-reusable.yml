name: Build Flutter APK (Reusable)

on:
  workflow_call:
    inputs:
      jobId:
        required: true
        type: string
      userId:
        required: true
        type: string
      payload:
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 27

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Project ZIP
        run: |
          URL=$(echo '${{ inputs.payload }}' | jq -r '.zipAssetUrl')
          curl -L -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/octet-stream" -o project.zip "$URL"
          mkdir -p project
          unzip -qq project.zip -d project
          PUBSPEC=$(find project -maxdepth 8 -iname "pubspec.yaml" | head -1)
          if [ -z "$PUBSPEC" ]; then
            echo "pubspec.yaml tidak ditemukan di dalam ZIP"
            exit 1
          fi
          PROJECT_ROOT=$(dirname "$PUBSPEC")
          echo "PROJECT_ROOT=$PROJECT_ROOT" >> $GITHUB_ENV

      - name: Clean Stale Build Cache
        run: |
          cd "${{ env.PROJECT_ROOT }}"
          rm -rf build .dart_tool android/.gradle android/build android/app/build ios/Pods ios/.symlinks
          find . -iname "local.properties" -delete

      - name: Fix Android SDK Path
        run: echo "sdk.dir=$ANDROID_HOME" > "${{ env.PROJECT_ROOT }}/android/local.properties"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install NDK and Build Tools
        run: |
          # Platform SDK di-install secara dinamis setelah pub get
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "ndk;27.0.12077973" \
            "ndk;28.2.13676358" \
            "build-tools;35.0.0" \
            --sdk_root=$ANDROID_HOME 2>&1 | tail -3 || true

      - name: Detect Required Flutter Version
        run: |
          if grep -A3 '^environment:' "${{ env.PROJECT_ROOT }}/pubspec.yaml" | grep -qE '^\s*flutter:\s*[''"]?[0-9]'; then
            echo "HAS_FLUTTER_VERSION=true" >> $GITHUB_ENV
          else
            echo "HAS_FLUTTER_VERSION=false" >> $GITHUB_ENV

            DART_MIN=$(grep -A3 '^environment:' "${{ env.PROJECT_ROOT }}/pubspec.yaml" | grep -oE "sdk:\s*['\"]?>=[0-9]+\.[0-9]+" | grep -oE "[0-9]+\.[0-9]+" | head -1)
            echo "Terdeteksi Dart SDK minimum: $DART_MIN"

            INFERRED_FLUTTER=$(python3 - "$DART_MIN" <<'PYEOF'
          import sys

          dart_min = sys.argv[1] if len(sys.argv) > 1 else ''
          table = [
              ('3.9', '3.35.0'), ('3.8', '3.32.0'), ('3.7', '3.29.0'), ('3.6', '3.27.0'),
              ('3.5', '3.24.0'), ('3.4', '3.22.0'), ('3.3', '3.19.0'), ('3.2', '3.16.0'),
              ('3.1', '3.13.0'), ('3.0', '3.10.0'),
          ]
          if not dart_min:
              print('3.24.5')
          else:
              try:
                  major, minor = map(int, dart_min.split('.'))
                  result = '3.10.0'
                  for d_ver, f_ver in table:
                      d_major, d_minor = map(int, d_ver.split('.'))
                      if (major, minor) >= (d_major, d_minor):
                          result = f_ver
                          break
                  print(result)
              except Exception:
                  print('3.24.5')
          PYEOF
          )
            echo "Flutter yang dipakai (inferred dari Dart SDK): $INFERRED_FLUTTER"
            echo "INFERRED_FLUTTER_VERSION=$INFERRED_FLUTTER" >> $GITHUB_ENV
          fi

      - name: Setup Flutter (versi sesuai project)
        if: env.HAS_FLUTTER_VERSION == 'true'
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: ${{ env.PROJECT_ROOT }}/pubspec.yaml
          channel: stable
          cache: true

      - name: Setup Flutter (versi hasil inferensi dari Dart SDK project)
        if: env.HAS_FLUTTER_VERSION == 'false'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.INFERRED_FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Flutter Pub Get (attempt 1)
        id: pub_get_1
        working-directory: ${{ env.PROJECT_ROOT }}
        continue-on-error: true
        run: |
          flutter pub get 2>&1 | tee /tmp/pub_get_1.log
          exit ${PIPESTATUS[0]}

      - name: Deteksi Saran Versi Flutter dari Pub
        if: steps.pub_get_1.outcome == 'failure'
        run: |
          SUGGESTED=$(grep -oE "Try using the Flutter SDK version: [0-9]+\.[0-9]+\.[0-9]+" /tmp/pub_get_1.log | grep -oE "[0-9]+\.[0-9]+\.[0-9]+" | head -1)
          if [ -n "$SUGGESTED" ]; then
            echo "Pub menyarankan Flutter versi: $SUGGESTED"
            echo "SUGGESTED_FLUTTER_VERSION=$SUGGESTED" >> $GITHUB_ENV
          else
            echo "Tidak ada saran versi spesifik dari pub, gagal murni."
          fi

      - name: Setup Flutter (ganti ke versi saran pub)
        if: steps.pub_get_1.outcome == 'failure' && env.SUGGESTED_FLUTTER_VERSION != ''
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.SUGGESTED_FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Flutter Pub Get (attempt 2, setelah ganti versi)
        if: steps.pub_get_1.outcome == 'failure' && env.SUGGESTED_FLUTTER_VERSION != ''
        working-directory: ${{ env.PROJECT_ROOT }}
        run: flutter pub get

      - name: Gagalkan Job Jika Pub Get Tetap Gagal
        if: steps.pub_get_1.outcome == 'failure' && env.SUGGESTED_FLUTTER_VERSION == ''
        run: |
          echo "flutter pub get gagal dan tidak ada saran versi Flutter yang bisa dicoba."
          exit 1

      # ─────────────────────────────────────────────────────────────────────
      # Auto-detect SDK dari pub-cache + Gradle sync ringan, install + patch
      # ─────────────────────────────────────────────────────────────────────
      - name: Auto-Detect & Install Required Android SDK Platform
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          # --- 1. Baca compileSdk dari project build.gradle ---
          PROJECT_COMPILE_SDK=0
          GRADLE_FILE=""
          for f in "android/app/build.gradle.kts" "android/app/build.gradle"; do
            if [ -f "$f" ]; then
              SDK=$(grep -E "compileSdk" "$f" 2>/dev/null | grep -oE '[0-9]{2,}' | sort -n | tail -1 || echo "0")
              if [ -n "$SDK" ] && [ "$SDK" -gt 0 ]; then
                PROJECT_COMPILE_SDK=$SDK
                GRADLE_FILE="$f"
              fi
              break
            fi
          done
          echo "Project compileSdk: $PROJECT_COMPILE_SDK (file: ${GRADLE_FILE:-tidak ditemukan})"

          # --- 2. Scan pub-cache untuk cari compileSdk tertinggi dari plugins ---
          # Cari semua build.gradle di pub-cache dengan berbagai format
          PUB_CACHE_DIR="${PUB_CACHE:-$HOME/.pub-cache}"
          echo "Scanning pub-cache di: $PUB_CACHE_DIR"

          PLUGIN_COMPILE_SDK=$(find "$PUB_CACHE_DIR" -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) \
            2>/dev/null \
            | xargs grep -h "compileSdk" 2>/dev/null \
            | grep -oE '[0-9]{2,}' \
            | sort -n | tail -1 || echo "0")

          echo "Highest compileSdk dari plugins: $PLUGIN_COMPILE_SDK"

          # --- 3. Tentukan SDK tertinggi yang dibutuhkan ---
          REQUIRED_SDK=$PROJECT_COMPILE_SDK
          if [ -n "$PLUGIN_COMPILE_SDK" ] && [ "$PLUGIN_COMPILE_SDK" -gt "$REQUIRED_SDK" ]; then
            REQUIRED_SDK=$PLUGIN_COMPILE_SDK
          fi

          # Minimum sanity check
          if [ -z "$REQUIRED_SDK" ] || [ "$REQUIRED_SDK" -lt 33 ]; then
            REQUIRED_SDK=35
          fi

          echo "Final required SDK: $REQUIRED_SDK"
          echo "DETECTED_COMPILE_SDK=$REQUIRED_SDK" >> $GITHUB_ENV

          # --- 4. Patch build.gradle kalau project SDK kurang dari required ---
          if [ -n "$GRADLE_FILE" ] && [ "$REQUIRED_SDK" -gt "$PROJECT_COMPILE_SDK" ]; then
            echo "Patching $GRADLE_FILE: compileSdk $PROJECT_COMPILE_SDK -> $REQUIRED_SDK"
            # Pakai python untuk patch yang reliable, hindari masalah sed regex
            python3 - "$GRADLE_FILE" "$PROJECT_COMPILE_SDK" "$REQUIRED_SDK" <<'PYEOF'
          import sys, re

          gradle_file = sys.argv[1]
          old_sdk = sys.argv[2]
          new_sdk = sys.argv[3]

          with open(gradle_file, 'r') as f:
              content = f.read()

          # Ganti compileSdk dan targetSdk (semua format: dengan/tanpa =, dengan/tanpa Version)
          patched = re.sub(
              r'(compileSdk(?:Version)?\s*(?:=\s*)?)'  + re.escape(old_sdk),
              lambda m: m.group(1) + new_sdk,
              content
          )
          patched = re.sub(
              r'(targetSdk(?:Version)?\s*(?:=\s*)?)' + re.escape(old_sdk),
              lambda m: m.group(1) + new_sdk,
              patched
          )

          if patched != content:
              with open(gradle_file, 'w') as f:
                  f.write(patched)
              print(f"Patched: compileSdk/targetSdk {old_sdk} -> {new_sdk}")
          else:
              print(f"Tidak ada perubahan — pattern tidak ditemukan di {gradle_file}")
          PYEOF

            echo "=== Isi build.gradle setelah patch ==="
            grep -E "compileSdk|targetSdk" "$GRADLE_FILE"
          else
            echo "Tidak perlu patch compileSdk."
          fi

          # --- 5. Install required platform SDK ---
          echo "Installing platforms;android-$REQUIRED_SDK ..."
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-$REQUIRED_SDK" \
            --sdk_root=$ANDROID_HOME 2>&1 | tail -5 || true

          # Install android-35 sebagai base fallback
          if [ "$REQUIRED_SDK" != "35" ]; then
            echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
              "platforms;android-35" \
              --sdk_root=$ANDROID_HOME 2>&1 | tail -3 || true
          fi

      - name: Tune JVM Memory untuk Gradle
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          mkdir -p android
          touch android/gradle.properties
          grep -q "org.gradle.jvmargs" android/gradle.properties || echo "org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError" >> android/gradle.properties
          grep -q "org.gradle.daemon" android/gradle.properties || echo "org.gradle.daemon=true" >> android/gradle.properties
          cat android/gradle.properties

      - name: Build APK Release
        working-directory: ${{ env.PROJECT_ROOT }}
        timeout-minutes: 25
        run: |
          set +e
          BUILD_LOG_FILE=$(mktemp)
          flutter build apk --release --no-tree-shake-icons 2>&1 | tee "$BUILD_LOG_FILE"
          BUILD_EXIT=${PIPESTATUS[0]}

          # Recovery 1: minSdk terlalu rendah
          if [ $BUILD_EXIT -ne 0 ]; then
            REQUIRED_MIN=$(grep -oE "cannot be smaller than version [0-9]+" "$BUILD_LOG_FILE" | grep -oE "[0-9]+" | head -1)
            if [ -n "$REQUIRED_MIN" ]; then
              echo "Auto-patch minSdk -> $REQUIRED_MIN, build ulang..."
              python3 - "$REQUIRED_MIN" <<'PYEOF'
          import re, os, sys

          required = sys.argv[1]
          candidates = ["android/app/build.gradle.kts", "android/app/build.gradle"]
          for path in candidates:
              if os.path.exists(path):
                  with open(path) as f:
                      content = f.read()
                  new_content = re.sub(
                      r'(minSdk(?:Version)?\s*=?\s*)(flutter\.minSdkVersion|\d+)',
                      lambda m: m.group(1) + required,
                      content
                  )
                  if new_content != content:
                      with open(path, 'w') as f:
                          f.write(new_content)
                      print(f"Patched {path}: minSdk -> {required}")
                  break
          PYEOF
              flutter build apk --release --no-tree-shake-icons 2>&1 | tee "$BUILD_LOG_FILE"
              BUILD_EXIT=${PIPESTATUS[0]}
            fi
          fi

          # Recovery 2: Missing platform SDK atau compileSdk terlalu rendah (safety net)
          if [ $BUILD_EXIT -ne 0 ]; then
            # Cek "Failed to find Platform SDK" → install missing SDK
            MISSING_PLATFORM=$(grep -oE "platforms;android-[0-9]+" "$BUILD_LOG_FILE" | grep -oE "[0-9]+" | sort -n | tail -1)
            # Cek juga "requires to be compiled against a higher Android SDK version"
            REQUIRED_COMPILE=$(grep -oE "compiles against Android SDK [0-9]+" "$BUILD_LOG_FILE" | grep -oE "[0-9]+" | sort -n | tail -1)

            TARGET_SDK=""
            if [ -n "$REQUIRED_COMPILE" ]; then
              TARGET_SDK=$REQUIRED_COMPILE
            elif [ -n "$MISSING_PLATFORM" ]; then
              TARGET_SDK=$MISSING_PLATFORM
            fi

            if [ -n "$TARGET_SDK" ]; then
              echo "Recovery: install platforms;android-$TARGET_SDK dan patch compileSdk..."

              echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
                "platforms;android-$TARGET_SDK" \
                --sdk_root=$ANDROID_HOME 2>&1 | tail -5

              python3 - "$TARGET_SDK" <<'PYEOF'
          import re, os, sys

          new_sdk = sys.argv[1]
          candidates = ["android/app/build.gradle.kts", "android/app/build.gradle"]
          for path in candidates:
              if os.path.exists(path):
                  with open(path) as f:
                      content = f.read()
                  # Ambil nilai compileSdk yang ada
                  m = re.search(r'compileSdk(?:Version)?\s*(?:=\s*)?(\d+)', content)
                  if m:
                      old_sdk = m.group(1)
                      if int(new_sdk) > int(old_sdk):
                          patched = re.sub(
                              r'(compileSdk(?:Version)?\s*(?:=\s*)?)' + re.escape(old_sdk),
                              lambda x: x.group(1) + new_sdk,
                              content
                          )
                          patched = re.sub(
                              r'(targetSdk(?:Version)?\s*(?:=\s*)?)' + re.escape(old_sdk),
                              lambda x: x.group(1) + new_sdk,
                              patched
                          )
                          with open(path, 'w') as f:
                              f.write(patched)
                          print(f"Patched {path}: compileSdk/targetSdk {old_sdk} -> {new_sdk}")
                      else:
                          print(f"compileSdk {old_sdk} sudah >= {new_sdk}, skip patch")
                  break
          PYEOF

              flutter build apk --release --no-tree-shake-icons 2>&1 | tee "$BUILD_LOG_FILE"
              BUILD_EXIT=${PIPESTATUS[0]}
            fi
          fi

          # Recovery 3: Incompatibility versi package
          if [ $BUILD_EXIT -ne 0 ]; then
            INCOMPAT=$(grep -cE "can't be (extended|implemented|mixed in) outside of its library|Error: The (method|getter|setter|class|argument) .* (isn't defined|can't be)" "$BUILD_LOG_FILE" || true)
            if [ "$INCOMPAT" -gt 0 ]; then
              echo "Incompatibility terdeteksi, flutter pub upgrade..."
              flutter pub upgrade
              flutter build apk --release --no-tree-shake-icons 2>&1 | tee "$BUILD_LOG_FILE"
              BUILD_EXIT=${PIPESTATUS[0]}
            fi
          fi

          # Recovery 4: Masih incompatible → coba major-versions
          if [ $BUILD_EXIT -ne 0 ]; then
            INCOMPAT2=$(grep -cE "can't be (extended|implemented|mixed in) outside of its library|Error: The (method|getter|setter|class|argument) .* (isn't defined|can't be)" "$BUILD_LOG_FILE" || true)
            if [ "$INCOMPAT2" -gt 0 ]; then
              echo "Masih incompatible, flutter pub upgrade --major-versions..."
              flutter pub upgrade --major-versions
              flutter build apk --release --no-tree-shake-icons
              BUILD_EXIT=$?
            fi
          fi

          # Recovery 5: Plugin butuh SDK tidak tersedia, coba downgrade plugin
          if [ $BUILD_EXIT -ne 0 ]; then
            OFFENDING=$(grep -oE "The plugin [a-zA-Z0-9_]+ requires Android SDK version [0-9]+" "$BUILD_LOG_FILE" | grep -oE "^The plugin [a-zA-Z0-9_]+" | grep -oE "[a-zA-Z0-9_]+$" | head -1)
            if [ -n "$OFFENDING" ]; then
              echo "Downgrade plugin $OFFENDING dan build ulang..."
              flutter pub downgrade "$OFFENDING"
              flutter build apk --release --no-tree-shake-icons
              BUILD_EXIT=$?
            fi
          fi

          exit $BUILD_EXIT

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ inputs.jobId }}
          path: ${{ env.PROJECT_ROOT }}/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
