name: Build Flutter APK (Smart Version Pool)

on:
  workflow_call:
    inputs:
      jobId:
        required: true
        type: string
      userId:
        required: true
        type: string
      payload:
        required: true
        type: string

env:
  FLUTTER_VERSION_POOL: |
    3.32.0
    3.32.5
    3.35.0
    3.38.0
    3.47.0

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Project ZIP
        run: |
          URL=$(echo '${{ inputs.payload }}' | jq -r '.zipAssetUrl')
          curl -L \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/octet-stream" \
            -o project.zip "$URL"

          mkdir -p project

          unzip -qq project.zip -d project 2>/dev/null \
            || python3 -m zipfile -e project.zip project/ 2>/dev/null \
            || unzip project.zip -d project \
            || true

          chmod -R 755 project

          PUBSPEC=$(find project -type f -iname "pubspec.yaml" | head -1)
          if [ -z "$PUBSPEC" ]; then
            echo "pubspec.yaml tidak ditemukan di dalam ZIP"
            ls -la project/
            exit 1
          fi

          PROJECT_ROOT=$(cd "$(dirname "$PUBSPEC")" && pwd)
          echo "PROJECT_ROOT=$PROJECT_ROOT" >> $GITHUB_ENV
          echo "Proyek ditemukan di: $PROJECT_ROOT"
          echo "Struktur:"
          ls -la "$PROJECT_ROOT/" | head -15

      - name: Clean Stale Build Cache
        run: |
          TARGET_DIR="${{ env.PROJECT_ROOT }}"
          if [ -d "$TARGET_DIR" ]; then
            cd "$TARGET_DIR"
            rm -rf build .dart_tool android/.gradle android/build android/app/build ios/Pods ios/.symlinks
            find . -iname "local.properties" -delete
            find . -iname "pubspec.lock" -delete
          else
            echo "Error: Direktori $TARGET_DIR tidak ditemukan."
            exit 1
          fi

      - name: Fix Android SDK Path
        run: |
          echo "sdk.dir=$ANDROID_HOME" > "${{ env.PROJECT_ROOT }}/android/local.properties"
          echo "Isi local.properties:"
          cat "${{ env.PROJECT_ROOT }}/android/local.properties"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install NDK and SDK Platforms
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            --sdk_root=$ANDROID_HOME "cmdline-tools;latest" 2>&1 | tail -3 || true

          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            --sdk_root=$ANDROID_HOME \
            "ndk;27.0.12077973" \
            "ndk;28.2.13676358" \
            "build-tools;35.0.0" \
            "platforms;android-35" \
            "platforms;android-36" 2>&1 | tail -5 || true

          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            --sdk_root=$ANDROID_HOME \
            "platforms;android-37" 2>&1 | tail -3 || true

          if [ ! -d "$ANDROID_HOME/platforms/android-37" ]; then
            for VARIANT in "android-37.0" "android-37.1" "android-37.2-beta1" "android-37.2" "android-37.2-beta2"; do
              if [ -d "$ANDROID_HOME/platforms/$VARIANT" ]; then
                echo "Menyalin $VARIANT ke android-37..."
                cp -r "$ANDROID_HOME/platforms/$VARIANT" "$ANDROID_HOME/platforms/android-37"
                if [ -f "$ANDROID_HOME/platforms/android-37/package.xml" ]; then
                  sed -i 's|<api-level>[0-9.]*</api-level>|<api-level>37</api-level>|g' \
                    "$ANDROID_HOME/platforms/android-37/package.xml" || true
                  sed -i 's|<codename>[^<]*</codename>|<codename></codename>|g' \
                    "$ANDROID_HOME/platforms/android-37/package.xml" || true
                  sed -i -E 's/path="platforms;android-37[^"]*"/path="platforms;android-37"/g' \
                    "$ANDROID_HOME/platforms/android-37/package.xml" || true
                  echo "package.xml diupdate untuk android-37"
                fi
                echo "Copy selesai: android-37 dari $VARIANT"
                break
              fi
            done
          fi

          if [ ! -d "$ANDROID_HOME/platforms/android-37" ]; then
            echo "sdkmanager dan copy gagal, mencoba wget dari Google..."
            SDK37_INSTALLED=false

            for ZIP_NAME in "platform-37_r01.zip" "android-37_r01.zip" "platform-37_r02.zip"; do
              wget -q --timeout=60 \
                "https://dl.google.com/android/repository/${ZIP_NAME}" \
                -O /tmp/android-37.zip 2>/dev/null || true

              if [ -f /tmp/android-37.zip ] && [ -s /tmp/android-37.zip ]; then
                FILE_TYPE=$(file /tmp/android-37.zip | grep -i "zip\|archive" || true)
                if [ -n "$FILE_TYPE" ]; then
                  echo "Download berhasil: ${ZIP_NAME}"
                  mkdir -p /tmp/android-37-extracted
                  unzip -qq /tmp/android-37.zip -d /tmp/android-37-extracted 2>/dev/null || true
                  INNER=$(find /tmp/android-37-extracted -maxdepth 1 -mindepth 1 -type d | head -1)
                  if [ -n "$INNER" ]; then
                    mkdir -p "$ANDROID_HOME/platforms/android-37"
                    cp -r "$INNER/." "$ANDROID_HOME/platforms/android-37/"
                    SDK37_INSTALLED=true
                    echo "SDK 37 berhasil di-install via wget"
                    break
                  fi
                fi
              fi
              rm -f /tmp/android-37.zip
            done

            if [ "$SDK37_INSTALLED" = false ]; then
              echo "Semua URL wget gagal, mencoba ssl.google.com..."
              for ZIP_NAME in "platform-37_r01.zip" "android-37_r01.zip"; do
                wget -q --timeout=60 \
                  "https://dl-ssl.google.com/android/repository/${ZIP_NAME}" \
                  -O /tmp/android-37.zip 2>/dev/null || true

                if [ -f /tmp/android-37.zip ] && [ -s /tmp/android-37.zip ]; then
                  FILE_TYPE=$(file /tmp/android-37.zip | grep -i "zip\|archive" || true)
                  if [ -n "$FILE_TYPE" ]; then
                    echo "Download berhasil dari ssl mirror: ${ZIP_NAME}"
                    mkdir -p /tmp/android-37-extracted2
                    unzip -qq /tmp/android-37.zip -d /tmp/android-37-extracted2 2>/dev/null || true
                    INNER=$(find /tmp/android-37-extracted2 -maxdepth 1 -mindepth 1 -type d | head -1)
                    if [ -n "$INNER" ]; then
                      mkdir -p "$ANDROID_HOME/platforms/android-37"
                      cp -r "$INNER/." "$ANDROID_HOME/platforms/android-37/"
                      SDK37_INSTALLED=true
                      echo "SDK 37 berhasil di-install via ssl mirror"
                      break
                    fi
                  fi
                fi
                rm -f /tmp/android-37.zip
              done
            fi

            if [ "$SDK37_INSTALLED" = false ]; then
              echo "SDK 37 tidak tersedia dari semua sumber, fallback downgrade ke SDK 36..."
              for gradle_file in "${{ env.PROJECT_ROOT }}/android/app/build.gradle.kts" "${{ env.PROJECT_ROOT }}/android/app/build.gradle"; do
                [ -f "$gradle_file" ] || continue
                sed -i 's/targetSdk = 37/targetSdk = 36/g' "$gradle_file"
                sed -i 's/compileSdk = 37/compileSdk = 36/g' "$gradle_file"
              done
              echo "Fallback ke SDK 36 selesai"
            fi
          fi

      - name: Install FVM and Flutter versions
        run: |
          curl -fsSL https://fvm.app/install.sh | bash
          export PATH="$PATH:$HOME/.fvm/bin"
          fvm install 3.32.0 2>&1 | tail -10 || true
          fvm install 3.32.5 2>&1 | tail -10 || true
          fvm install 3.35.0 2>&1 | tail -10 || true
          fvm install 3.38.0 2>&1 | tail -10 || true
          fvm install 3.47.0 2>&1 | tail -10 || true
          fvm flutter --version

      - name: Prepare Python helper
        run: |
          cat > "${{ env.PROJECT_ROOT }}/pyhelper.py" << 'EOF'
import sys
import os
import re

def patch_settings(gradle_kts_path, agp_ver, kotlin_ver):
    with open(gradle_kts_path, 'r') as f:
        content = f.read()
    content = re.sub(r'id\("com\.android\.application"\)\s+version\s+"[^"]*"', f'id("com.android.application") version "{agp_ver}"', content)
    content = re.sub(r'id\("org\.jetbrains\.kotlin\.android"\)\s+version\s+"[^"]*"', f'id("org.jetbrains.kotlin.android") version "{kotlin_ver}"', content)
    content = re.sub(r'kotlin\("android"\)\s+version\s+"[^"]*"', f'kotlin("android") version "{kotlin_ver}"', content)
    with open(gradle_kts_path, 'w') as f:
        f.write(content)
    print(f"Patched {gradle_kts_path} with AGP={agp_ver}, Kotlin={kotlin_ver}")

def patch_gradle_wrapper(gradle_wrapper_path, gradle_ver):
    with open(gradle_wrapper_path, 'r') as f:
        content = f.read()
    content = re.sub(r'distributionUrl=.*gradle-[^-]*-.*\.zip', f'distributionUrl=https\\://services.gradle.org/distributions/gradle-{gradle_ver}-all.zip', content)
    with open(gradle_wrapper_path, 'w') as f:
        f.write(content)
    print(f"Patched {gradle_wrapper_path} with gradle={gradle_ver}")

def patch_properties(props_path, gradle_ver, agp_ver, kotlin_ver):
    lines = []
    props = {}
    if os.path.exists(props_path):
        with open(props_path, 'r') as f:
            for line in f:
                if line.strip() and not line.startswith('#'):
                    if '=' in line:
                        k, v = line.split('=', 1)
                        props[k.strip()] = v.strip()
    props['org.gradle.jvmargs'] = '-Xmx6g -XX:MaxMetaspaceSize=3g -XX:+UseG1GC'
    props['org.gradle.parallel'] = 'true'
    props['org.gradle.workers.max'] = '4'
    props['android.gradle.plugin.version'] = agp_ver
    props['kotlin.version'] = kotlin_ver
    with open(props_path, 'w') as f:
        for k, v in props.items():
            f.write(f'{k}={v}\n')
    print(f"Updated {props_path}")

if __name__ == '__main__':
    if sys.argv[1] == 'patch_settings':
        patch_settings(sys.argv[2], sys.argv[3], sys.argv[4])
    elif sys.argv[1] == 'patch_gradle_wrapper':
        patch_gradle_wrapper(sys.argv[2], sys.argv[3])
    elif sys.argv[1] == 'patch_properties':
        patch_properties(sys.argv[2], sys.argv[3], sys.argv[4], sys.argv[5])
EOF
        cat > "${{ env.PROJECT_ROOT }}/gradle_fix.sh" << 'EOF'
#!/bin/bash
PROJECT_ROOT=$1
AGP_VERSION="8.12.0"
KOTLIN_VERSION="2.1.0"
GRADLE_VERSION="8.12"

for gradle_kts in "$PROJECT_ROOT/android/settings.gradle.kts" "$PROJECT_ROOT/android/build.gradle.kts"; do
  if [ -f "$gradle_kts" ]; then
    sed -i "s/id(\"com.android.application\") version \"[^\"]*\"/id(\"com.android.application\") version \"$AGP_VERSION\"/g" "$gradle_kts"
    sed -i "s/id(\"org.jetbrains.kotlin.android\") version \"[^\"]*\"/id(\"org.jetbrains.kotlin.android\") version \"$KOTLIN_VERSION\"/g" "$gradle_kts"
    sed -i "s/kotlin(\"android\") version \"[^\"]*\"/kotlin(\"android\") version \"$KOTLIN_VERSION\"/g" "$gradle_kts"
  fi
done

for gradle_wrapper in "$PROJECT_ROOT/android/gradle/wrapper/gradle-wrapper.properties"; do
  if [ -f "$gradle_wrapper" ]; then
    sed -i "s|distributionUrl=.*gradle-.*-all.zip|distributionUrl=https\\://services.gradle.org/distributions/gradle-$GRADLE_VERSION-all.zip|g" "$gradle_wrapper"
  fi
done

if [ -f "$PROJECT_ROOT/android/gradle.properties" ]; then
  sed -i '/^org.gradle.jvmargs=/d' "$PROJECT_ROOT/android/gradle.properties"
  sed -i '/^org.gradle.parallel=/d' "$PROJECT_ROOT/android/gradle.properties"
  sed -i '/^org.gradle.workers.max=/d' "$PROJECT_ROOT/android/gradle.properties"
  echo "org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=3g -XX:+UseG1GC" >> "$PROJECT_ROOT/android/gradle.properties"
  echo "org.gradle.parallel=true" >> "$PROJECT_ROOT/android/gradle.properties"
  echo "org.gradle.workers.max=4" >> "$PROJECT_ROOT/android/gradle.properties"
fi
EOF
        chmod +x "${{ env.PROJECT_ROOT }}/gradle_fix.sh"
      }

      - name: Build Flutter APK
        id: build_retry
        run: |
          export PATH="$PATH:$HOME/.fvm/bin"
          cd "${{ env.PROJECT_ROOT }}"
          export FLUTTER_VERSION_POOL_ARR=(${{ env.FLUTTER_VERSION_POOL }})

          SUCCESS=false
          FLUTTER_VERSION_USED=""
          FA_VERSION_USED=""
          PUB_LOG="/tmp/pub_$$.log"
          BUILD_LOG="/tmp/build_$$.log"

          for FLUTTER_VER in "${FLUTTER_VERSION_POOL_ARR[@]}"; do
            echo "Trying Flutter $FLUTTER_VER..."
            fvm use "$FLUTTER_VER" 2>&1 | tail -5 || continue

            for FA_VER in "10.7.0" "10.8.0" "10.9.0" "10.9.1" "11.0.0"; do
              echo "Trying font_awesome_flutter $FA_VER..."

              grep -q "font_awesome_flutter:" pubspec.yaml 2>/dev/null && sed -i "s/font_awesome_flutter:.*/font_awesome_flutter: $FA_VER/g" pubspec.yaml

              fvm flutter pub get 2>&1 | tee "$PUB_LOG"

              HAS_KOTLIN_ERR=$(grep -cE "Unresolved reference.*kotlin\s*\{|compilerOptions|jvmTarget" "$PUB_LOG" 2>/dev/null || true)
              if [ "${HAS_KOTLIN_ERR:-0}" -gt 0 ]; then
                echo "Kotlin/AGP version mismatch detected, applying gradle fix..."
                "${{ env.PROJECT_ROOT }}/gradle_fix.sh" "${{ env.PROJECT_ROOT }}"
                fvm flutter pub get 2>&1 | tee "$PUB_LOG"
              fi

              fvm flutter build apk --release --no-tree-shake-icons --android-skip-build-dependency-validation 2>&1 | tee "$BUILD_LOG"
              BUILD_EXIT=${PIPESTATUS[0]}

              if [ $BUILD_EXIT -eq 0 ]; then
                echo "BUILD BERHASIL dengan Flutter $FLUTTER_VER + font_awesome_flutter $FA_VER"
                SUCCESS=true
                FLUTTER_VERSION_USED="$FLUTTER_VER"
                FA_VERSION_USED="$FA_VER"
                break
              fi

              HAS_SDK_ERR=$(grep -cE "Failed to find Platform SDK|compiles against Android SDK [0-9]+" "$BUILD_LOG" 2>/dev/null || true)
              if [ "${HAS_SDK_ERR:-0}" -gt 0 ]; then
                echo "SDK error detected, retrying..."
                continue
              fi

              PH_SDK_ERR=$(grep -cE "permission_handler_android.*SDK" "$BUILD_LOG" 2>/dev/null || true)
              if [ "${PH_SDK_ERR:-0}" -gt 0 ]; then
                echo "permission_handler_android SDK issue, retrying..."
                continue
              fi

              HAS_KOTLIN_BUILD_ERR=$(grep -cE "Unresolved reference.*kotlin\s*\{|metadata version|kotlin\s*\{.*Unresolved" "$BUILD_LOG" 2>/dev/null || true)
              if [ "${HAS_KOTLIN_BUILD_ERR:-0}" -gt 0 ]; then
                echo "Kotlin compilation error, applying gradle fix and retry..."
                "${{ env.PROJECT_ROOT }}/gradle_fix.sh" "${{ env.PROJECT_ROOT }}"
                rm -rf build .dart_tool android/build android/app/build
                fvm flutter pub get 2>&1 | tee "$PUB_LOG"
                fvm flutter build apk --release --no-tree-shake-icons --android-skip-build-dependency-validation 2>&1 | tee "$BUILD_LOG"
                BUILD_EXIT=${PIPESTATUS[0]}
                if [ $BUILD_EXIT -eq 0 ]; then
                  echo "BUILD BERHASIL setelah gradle fix"
                  SUCCESS=true
                  FLUTTER_VERSION_USED="$FLUTTER_VER"
                  FA_VERSION_USED="$FA_VER"
                  break
                fi
              fi
            done

            if [ "$SUCCESS" = true ]; then
              break
            fi
          done

          if [ "$SUCCESS" = false ]; then
            echo "SEMUA VERSI FLUTTER DI POOL SUDAH DICOBA - BUILD TETAP GAGAL"
            exit 1
          fi

          echo "flutter_version_used=$FLUTTER_VERSION_USED" >> $GITHUB_OUTPUT
          echo "fa_version_used=$FA_VERSION_USED" >> $GITHUB_OUTPUT

      - name: Upload Artifact
        if: steps.build_retry.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ inputs.jobId }}
          path: ${{ env.PROJECT_ROOT }}/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7

      - name: Build Success Summary
        if: steps.build_retry.outcome == 'success'
        run: |
          echo "BUILD BERHASIL"
          echo "Flutter Version: ${{ steps.build_retry.outputs.flutter_version_used }}"
          echo "font_awesome_flutter Version: ${{ steps.build_retry.outputs.fa_version_used }}"
          echo "APK Path: ${{ env.PROJECT_ROOT }}/build/app/outputs/flutter-apk/app-release.apk"
